<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f3d2b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Catalogo">
<title>Catalogo libri</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
  :root { --verde:#1f3d2b; --ottone:#b08d3c; --carta:#f7f3ea; --inchiostro:#222; --bordeaux:#7a2e2e; --salvia:#dfe6dc; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:var(--carta); color:var(--inchiostro); }
  header { background:var(--verde); color:#fff; padding:14px 16px; padding-top:calc(14px + env(safe-area-inset-top)); display:flex; justify-content:space-between; align-items:center; }
  header h1 { margin:0; font-size:20px; letter-spacing:.5px; }
  header button { background:transparent; color:#fff; border:1px solid rgba(255,255,255,.5); border-radius:8px; padding:6px 10px; font-size:14px; }
  main { padding:16px; max-width:640px; margin:0 auto; padding-bottom:calc(30px + env(safe-area-inset-bottom)); }
  label { display:block; margin-bottom:12px; font-size:14px; }
  input, textarea { width:100%; padding:12px; font-size:16px; border:1px solid #c9c2b2; border-radius:10px; background:#fff; margin-top:4px; font-family:inherit; }
  button { font-size:16px; border-radius:10px; border:none; padding:12px 16px; cursor:pointer; }
  button:disabled { opacity:.5; }
  .primario { background:var(--verde); color:#fff; width:100%; }
  .azioni { display:flex; gap:10px; margin-bottom:14px; }
  .azioni button { flex:1; padding:20px 8px; font-size:17px; background:var(--verde); color:#fff; }
  .azioni button.foto { background:var(--ottone); }
  .secondario { background:var(--salvia); color:var(--verde); width:100%; margin-top:8px; }
  #form-cerca { display:flex; gap:8px; margin:6px 0 10px; }
  #form-cerca input { margin:0; }
  #form-cerca button { background:var(--ottone); color:#fff; }
  #lettore { width:100%; border-radius:12px; overflow:hidden; margin-bottom:8px; }
  #stato { font-size:14px; color:#555; min-height:20px; margin:6px 0; }
  .errore { color:var(--bordeaux); }
  h2 { font-size:15px; text-transform:uppercase; letter-spacing:1px; color:var(--verde); margin:22px 0 8px; border-bottom:2px solid var(--ottone); padding-bottom:4px; }
  .scheda { background:#fff; border-radius:12px; padding:14px; margin-bottom:10px; box-shadow:0 1px 3px rgba(0,0,0,.08); border-left:5px solid var(--verde); }
  .scheda.evidenza { border-left-color:var(--ottone); background:#fffaf0; }
  .scheda.letto { border-left-color:#8a8a8a; }
  .titolo { font-size:18px; font-weight:600; margin:0 0 2px; }
  .autore { font-size:15px; margin:0 0 6px; }
  .dati { font-size:14px; color:#555; margin:0 0 8px; }
  .badge { display:inline-block; font-size:12px; padding:3px 8px; border-radius:20px; color:#fff; margin-bottom:8px; }
  .b-verificata { background:var(--verde); }
  .b-verificata_fonte_singola { background:#4f7a5c; }
  .b-stima_ai { background:#8a8a8a; }
  .mercato { font-size:14px; margin:6px 0; }
  details { margin-top:8px; font-size:14px; }
  summary { cursor:pointer; color:var(--verde); font-weight:600; }
  details.trappole summary { color:var(--bordeaux); }
  li { margin-bottom:6px; }
  .avviso { font-size:13px; color:#6b5a2e; background:#f3ead2; padding:8px 10px; border-radius:8px; margin-top:8px; }
  .riga { background:#fff; border-radius:8px; padding:8px 10px; margin-bottom:6px; font-size:14px; display:flex; gap:10px; align-items:flex-start; }
  .riga img { width:48px; height:auto; border-radius:4px; flex-shrink:0; }
  .riga a, .scheda a { color:var(--verde); }
  .vuoto { font-size:14px; color:#666; }
  #anteprima { width:100%; max-height:260px; object-fit:contain; border-radius:12px; background:#fff; margin-bottom:8px; }
</style>
</head>
<body>
<header><h1>Catalogo</h1><button id="esci" hidden>Esci</button></header>
<main>
  <section id="login" hidden>
    <form id="form-login">
      <label>Email<input type="email" id="email" required autocomplete="username"></label>
      <label>Password<input type="password" id="password" required autocomplete="current-password"></label>
      <button type="submit" class="primario">Entra</button>
      <p id="login-errore" class="errore"></p>
    </form>
  </section>

  <section id="app" hidden>
    <div class="azioni">
      <button id="scansiona">▥ Barcode</button>
      <button id="fotografa" class="foto">📷 Foto copertina</button>
    </div>
    <input type="file" id="file-foto" accept="image/*" capture="environment" hidden>
    <div id="lettore" hidden></div>
    <button id="annulla" class="secondario" hidden>Annulla scansione</button>
    <img id="anteprima" hidden alt="">
    <form id="form-cerca">
      <input id="campo" placeholder="ISBN, oppure titolo e autore" autocomplete="off">
      <button type="submit">Cerca</button>
    </form>
    <div id="stato"></div>
    <div id="risultati"></div>
  </section>
</main>

<script>
const SUPABASE_URL = "https://wuolsexkbovgxxuqvkwx.supabase.co";
const SUPABASE_KEY = "sb_publishable_a537vE2l_jjRYXF7hPyPsQ_xQnNebz7";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const $ = (id) => document.getElementById(id);
const esc = (t) => String(t ?? "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
const linkSicuro = (u) => /^https:\/\//i.test(u || "") ? esc(u) : "#";
const ETICHETTE = { verificata:"Verificata", verificata_fonte_singola:"Verificata · fonte singola", stima_ai:"Stima AI" };
const SOGLIA = 0.6;
let lettore = null;
let workerOcr = null;
let ultimaRichiesta = null;

// ---------- Accesso ----------
async function mostraSchermata() {
  const { data } = await sb.auth.getSession();
  const dentro = !!data.session;
  $("login").hidden = dentro;
  $("app").hidden = !dentro;
  $("esci").hidden = !dentro;
}
$("form-login").addEventListener("submit", async (e) => {
  e.preventDefault();
  $("login-errore").textContent = "";
  const { error } = await sb.auth.signInWithPassword({ email: $("email").value.trim(), password: $("password").value });
  if (error) $("login-errore").textContent = "Accesso non riuscito: controlla email e password.";
  mostraSchermata();
});
$("esci").addEventListener("click", async () => { await sb.auth.signOut(); mostraSchermata(); });
sb.auth.onAuthStateChange(() => mostraSchermata());

function pulisciSchermo() {
  $("risultati").innerHTML = "";
  $("anteprima").hidden = true;
  $("stato").textContent = "";
}
function bloccaPulsanti(si) { $("scansiona").disabled = si; $("fotografa").disabled = si; }

// ---------- Barcode ----------
$("scansiona").addEventListener("click", async () => {
  pulisciSchermo();
  $("lettore").hidden = false; $("annulla").hidden = false;
  bloccaPulsanti(true);
  $("stato").textContent = "Inquadra il codice a barre sul retro (quello che inizia con 978).";
  lettore = new Html5Qrcode("lettore", {
    formatsToSupport: [Html5QrcodeSupportedFormats.EAN_13],
    experimentalFeatures: { useBarCodeDetectorIfSupported: true },
    verbose: false
  });
  try {
    await lettore.start(
      { facingMode: "environment" },
      { fps: 10, qrbox: (w) => ({ width: Math.min(w * 0.9, 340), height: 130 }) },
      async (codice) => {
        if (!/^97[89]\d{10}$/.test(codice)) {
          $("stato").textContent = "Questo non è un ISBN (forse è il codice del prezzo): inquadra quello che inizia con 978.";
          return;
        }
        await fermaScansione();
        $("campo").value = codice;
        cerca({ isbn: codice }, "Cerco l'ISBN " + codice + "…");
      }
    );
  } catch (err) {
    await fermaScansione();
    $("stato").innerHTML = '<span class="errore">Non riesco ad aprire la fotocamera: controlla di aver dato il permesso al browser.</span>';
  }
});
async function fermaScansione() {
  if (lettore) { try { await lettore.stop(); lettore.clear(); } catch (_) {} lettore = null; }
  $("lettore").hidden = true; $("annulla").hidden = true;
  bloccaPulsanti(false);
}
$("annulla").addEventListener("click", () => { fermaScansione(); $("stato").textContent = ""; });

// ---------- Foto copertina (lettura sul telefono con Tesseract) ----------
async function ottieniWorker() {
  if (!workerOcr) {
    $("stato").textContent = "Preparo il lettore di testo (solo la prima volta, qualche secondo)…";
    workerOcr = await Tesseract.createWorker("ita+eng", 1, {
      logger: (m) => {
        if (m.status === "recognizing text") $("stato").textContent = "Leggo la copertina… " + Math.round(m.progress * 100) + "%";
      }
    });
  }
  return workerOcr;
}

$("fotografa").addEventListener("click", () => { $("file-foto").value = ""; $("file-foto").click(); });
$("file-foto").addEventListener("change", async () => {
  const file = $("file-foto").files && $("file-foto").files[0];
  if (!file) return;
  pulisciSchermo();
  bloccaPulsanti(true);
  try {
    $("stato").textContent = "Preparo la foto…";
    const tela = await preparaFoto(file, 1400);
    $("anteprima").src = tela.toDataURL("image/jpeg", 0.8);
    $("anteprima").hidden = false;
    const w = await ottieniWorker();
    const { data } = await w.recognize(tela);
    await cerca({ testo_ocr: (data && data.text) || "" }, "Cerco…");
  } catch (_) {
    $("stato").innerHTML = '<span class="errore">Non riesco a leggere la foto. Riprova con più luce.</span>';
  } finally {
    bloccaPulsanti(false);
  }
});

// Ridimensiona e converte in bianco e nero ad alto contrasto: aiuta molto la lettura
function preparaFoto(file, lato) {
  return new Promise((ok, ko) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      const s = Math.min(1, lato / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      const ctx = c.getContext("2d", { willReadFrequently: true });
      ctx.drawImage(img, 0, 0, c.width, c.height);
      const d = ctx.getImageData(0, 0, c.width, c.height);
      const p = d.data;
      for (let i = 0; i < p.length; i += 4) {
        let g = 0.299 * p[i] + 0.587 * p[i + 1] + 0.114 * p[i + 2];
        g = Math.max(0, Math.min(255, (g - 128) * 1.4 + 128));
        p[i] = p[i + 1] = p[i + 2] = g;
      }
      ctx.putImageData(d, 0, 0);
      URL.revokeObjectURL(url);
      ok(c);
    };
    img.onerror = () => { URL.revokeObjectURL(url); ko(); };
    img.src = url;
  });
}

// ---------- Ricerca manuale ----------
$("form-cerca").addEventListener("submit", (e) => {
  e.preventDefault();
  const v = $("campo").value.trim();
  if (!v) return;
  pulisciSchermo();
  const cifre = v.replace(/[-\s]/g, "");
  if (/^(\d{9}[\dXx]|\d{13})$/.test(cifre)) cerca({ isbn: cifre }, "Cerco l'ISBN…");
  else cerca({ testo: v }, "Cerco…");
});

async function cerca(corpo, messaggio) {
  ultimaRichiesta = corpo;
  $("risultati").innerHTML = "";
  $("stato").textContent = messaggio || "Cerco…";
  const { data, error } = await sb.functions.invoke("cerca", { body: corpo });
  if (error) {
    const stato = error.context && error.context.status;
    if (stato === 401) { await sb.auth.signOut(); mostraSchermata(); return; }
    let dettaglio = "Errore nella ricerca. Riprova tra poco.";
    try { const j = await error.context.json(); if (j && j.errore) dettaglio = j.errore; } catch (_) {}
    $("stato").innerHTML = '<span class="errore">' + esc(dettaglio) + '</span>';
    return;
  }
  $("stato").textContent = "";
  mostra(data);
}

// ---------- Risultati ----------
function schedaCatalogo(x, evidenza) {
  const trappole = (x.trappole || []).length
    ? `<details class="trappole"><summary>⚠️ Trappole (${x.trappole.length})</summary><ul>${x.trappole.map(t => `<li>${esc(t)}</li>`).join("")}</ul></details>` : "";
  const dati = [x.editore, x.anno, x.collana].filter(Boolean).map(esc).join(" · ");
  return `<div class="scheda ${evidenza ? "evidenza" : ""}">
    <span class="badge b-${esc(x.stato_verifica)}">${esc(ETICHETTE[x.stato_verifica] || x.stato_verifica)}</span>
    <p class="titolo">${esc(x.titolo)}</p>
    <p class="autore">${esc(x.autore)}</p>
    <p class="dati">${dati}</p>
    ${x.mercato ? `<p class="mercato"><strong>Mercato:</strong> ${esc(x.mercato)}</p>` : ""}
    ${trappole}
  </div>`;
}
function schedaSbn(r, etichetta, evidenza) {
  return `<div class="scheda ${evidenza ? "evidenza" : ""}">
    <p class="dati">${esc(etichetta)}</p>
    <p class="titolo">${esc(r.titolo)}</p>
    <p class="autore">${esc(r.autore || "")}</p>
    <p class="dati">${esc(r.pubblicazione || "")}${r.isbn ? " · ISBN " + esc(r.isbn) : ""}</p>
    <a href="${linkSicuro(r.link)}" target="_blank" rel="noopener">Apri in OPAC SBN</a>
  </div>`;
}

function mostra(d) {
  let h = "";

  if (d.testo_letto !== null && d.testo_letto !== undefined) {
    h += `<div class="scheda letto"><p class="dati">Testo letto dalla foto (correggilo se serve):</p>
      <textarea id="testo-letto" rows="3">${esc(d.chiave_usata || d.testo_letto)}</textarea>
      <button class="secondario" id="ricerca-letto">Cerca con questo testo</button></div>`;
  }
  if (d.errore) h += `<p class="errore">${esc(d.errore)}</p>`;

  const forti = (d.catalogo || []).filter(x => x.punteggio >= SOGLIA);
  const deboli = (d.catalogo || []).filter(x => x.punteggio < SOGLIA);

  if (forti.length) h += `<h2>Nel tuo catalogo</h2>` + forti.map(x => schedaCatalogo(x, false)).join("");
  if ((d.stesso_titolo_nel_catalogo || []).length) {
    h += `<h2>Questo titolo è nel tuo catalogo</h2>` + d.stesso_titolo_nel_catalogo.map(x => schedaCatalogo(x, true)).join("");
  }

  const s = d.sbn;
  if (s && s.errore) {
    h += `<h2>OPAC SBN</h2><p class="errore">${esc(s.errore)}</p>`;
  } else if (s) {
    h += `<h2>OPAC SBN</h2>`;
    if (s.edizione_in_mano) h += schedaSbn(s.edizione_in_mano, "Edizione che hai in mano", false);
    if (s.candidata_prima_edizione) {
      h += schedaSbn(s.candidata_prima_edizione, "Candidata prima edizione", true);
      h += `<p class="avviso">${esc(s.avviso)}</p>`;
    }
    if ((s.risultati || []).length) {
      const nota = s.elenco_completo ? "" : ` — mostrate ${s.risultati.length} su ${s.totale_in_sbn}`;
      h += `<details><summary>Tutte le edizioni in SBN (${esc(s.totale_in_sbn)})${esc(nota)}</summary>` +
        s.risultati.map(r => `<div class="riga"><div><strong>${esc(r.anno || "s.d.")}</strong> — ${esc(r.titolo)}<br>${esc(r.pubblicazione || "")} · <a href="${linkSicuro(r.link)}" target="_blank" rel="noopener">SBN</a></div></div>`).join("") +
        `</details>`;
    }
    if (!s.edizione_in_mano && !(s.risultati || []).length) h += `<p class="vuoto">Nessun risultato in SBN.</p>`;
  }

  const g = d.google_books;
  if (g && g.errore) {
    h += `<h2>Google Books</h2><p class="errore">${esc(g.errore)}</p>`;
  } else if (g && (g.risultati || []).length) {
    h += `<h2>Google Books</h2><p class="avviso">${esc(g.avviso)}</p>` +
      g.risultati.map(r => `<div class="riga">
        ${r.copertina ? `<img src="${linkSicuro(r.copertina)}" alt="">` : ""}
        <div><strong>${esc(r.titolo)}</strong><br>${esc((r.autori || []).join(", "))}<br>
        <span class="dati">${esc([r.editore, r.data].filter(Boolean).join(" · "))}${r.isbn ? " · ISBN " + esc(r.isbn) : ""}</span>
        ${r.link ? `<br><a href="${linkSicuro(r.link)}" target="_blank" rel="noopener">Apri</a>` : ""}</div></div>`).join("");
  }

  if (!forti.length && deboli.length) h += `<h2>Forse cercavi (catalogo)</h2>` + deboli.map(x => schedaCatalogo(x, false)).join("");
  if (forti.length && !s) h += `<button class="secondario" id="anche-fuori">Cerca anche in SBN e Google Books</button>`;
  if (!h) h = `<p class="vuoto">Nessun risultato.</p>`;

  $("risultati").innerHTML = h;

  const b = $("anche-fuori");
  if (b) b.addEventListener("click", () => cerca({ ...ultimaRichiesta, forza_sbn: true }, "Cerco anche fuori dal catalogo…"));
  const r = $("ricerca-letto");
  if (r) r.addEventListener("click", () => {
    const t = $("testo-letto").value.trim();
    if (t) { pulisciSchermo(); cerca({ testo: t }, "Cerco…"); }
  });
}

mostraSchermata();
</script>
</body>
</html>
